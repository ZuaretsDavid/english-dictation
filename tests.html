<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הכנה למבחן · unbox your English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8ec; --card:#ffffff; --ink:#2b2d42; --muted:#7a7d92;
    --accent:#ff7a59; --accent2:#4cc9f0; --target:#ffe066; --target-ink:#7a5200;
    --ok:#2ec4b6; --bad:#ef476f; --purple:#7b4fb3; --shadow:0 6px 20px rgba(43,45,66,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,sans-serif;font-size:18px;line-height:1.5}
  header{padding:18px 16px 4px;text-align:center}
  header h1{margin:0;font-size:28px}
  header a{color:var(--muted);font-size:16px}
  main{max-width:820px;margin:0 auto;padding:8px 16px 60px}
  .en{direction:ltr;font-family:"Andika",sans-serif}
  [hidden]{display:none !important}
  body > .bb{position:sticky;top:0;z-index:50}

  .btn{border:none;border-radius:14px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent2);color:#fff;display:inline-flex;gap:6px;align-items:center;justify-content:center}
  .btn.secondary{background:#eef0f6;color:var(--ink)}
  .btn.big{font-size:21px;padding:14px 22px;background:var(--accent)}
  .btn:active{transform:scale(.96)}
  .card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px}
  h2{font-size:22px;margin:22px 0 10px}

  /* בחירת מבחן */
  .dates{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
  .date{border:2px solid var(--purple);background:#fff;color:var(--purple);border-radius:999px;padding:6px 14px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
  .date.on{background:var(--purple);color:#fff}
  .date.past{opacity:.55}
  .countdown{text-align:center;font-size:22px;font-weight:700;margin:6px 0 2px}
  .test-title{text-align:center;color:var(--muted);margin:0 0 6px}

  /* נושאים */
  .topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .topic{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:6px}
  .topic .t-emoji{font-size:30px}
  .topic .t-en{font-family:"Andika",sans-serif;font-weight:700;font-size:22px;direction:ltr;text-align:right}
  .topic .t-he{color:var(--muted);font-size:16px}
  .topic .t-best{font-size:15px;color:var(--ok);font-weight:700;min-height:22px}
  .topic .t-btns{display:flex;gap:8px;margin-top:auto}
  .topic .t-btns .btn{flex:1;padding:8px 10px;font-size:16px}
  .mock{text-align:center;margin:20px 0 4px}
  .mock .t-best{color:var(--ok);font-weight:700;margin-top:6px}
  .links a{display:block;padding:8px 12px;margin:6px 0;background:#fff;border-radius:12px;box-shadow:var(--shadow);color:var(--ink);text-decoration:none}
  .links a:hover{background:#f3f8ff}

  /* הסבר */
  .rule h3{margin:16px 0 6px;font-size:20px}
  .rule .box{border-radius:16px;padding:12px 14px;margin:10px 0;border:2px solid}
  .rule .b1{background:#eef7ff;border-color:#1a7bb9} .rule .b2{background:#fff0f7;border-color:#d63384}
  .rule .b3{background:#eefaf0;border-color:#2e9e5b} .rule .b4{background:#f4effb;border-color:var(--purple)}
  .rule .big{font-family:"Andika",sans-serif;font-size:26px;font-weight:700;direction:ltr;text-align:left}
  .rule .ex{direction:ltr;text-align:left;font-family:"Andika",sans-serif;font-size:21px;line-height:1.9}
  .say{cursor:pointer;border-bottom:2px dotted var(--accent2);padding:0 2px;border-radius:4px}
  .say:hover{background:#e8f7fd}
  .rule .tip{color:var(--muted);font-size:16px}

  /* שאלה */
  .bar-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
  .bar{height:12px;background:#eef0f6;border-radius:99px;overflow:hidden;flex:1}
  .bar div{height:100%;background:var(--ok);width:0;transition:width .3s}
  .q-prompt{color:var(--muted);font-size:18px;margin-bottom:6px}
  .q-text{font-family:"Andika",sans-serif;font-size:32px;direction:ltr;text-align:center;margin:14px 0 18px;line-height:1.5}
  .q-text.he{direction:rtl;font-family:"Rubik",sans-serif}
  .blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--ink);padding:0 6px;text-align:center}
  .blank.ok{color:var(--ok);border-color:var(--ok)} .blank.bad{color:var(--bad);border-color:var(--bad)}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .opt{font-family:"Andika",sans-serif;font-size:24px;font-weight:700;border:3px solid #cfd8e3;background:#fff;color:var(--ink);border-radius:16px;padding:10px 22px;cursor:pointer;min-width:110px;direction:ltr}
  .opt.he{font-family:"Rubik",sans-serif;direction:rtl;font-size:21px}
  .opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
  .opt.picked{background:var(--purple);border-color:var(--purple);color:#fff}
  .opt:disabled{cursor:default}
  .write{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .write input{font-family:"Andika",sans-serif;font-size:26px;direction:ltr;padding:8px 14px;border:3px solid #cfd8e3;border-radius:14px;width:240px;text-align:center}
  .write input.ok{border-color:var(--ok);color:var(--ok)} .write input.bad{border-color:var(--bad);color:var(--bad)}
  .wbank{border:2px dashed #E0A562;background:#fff8ec;border-radius:14px;padding:8px 12px;margin:0 auto 14px;max-width:640px;text-align:center}
  .wbank .wb-title{font-size:15px;color:#A8692E;font-weight:700}
  .wbank .wb-words{font-size:22px;line-height:1.6}
  .b-line{min-height:64px;border-bottom:3px solid var(--ink);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end;padding:6px;margin:0 auto 16px;max-width:700px;direction:ltr}
  .b-line.ok{border-color:var(--ok)} .b-line.bad{border-color:var(--bad)}
  .b-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px;margin-bottom:14px;direction:ltr}
  .tile{font-family:"Andika",sans-serif;font-size:24px;border:3px solid #cfd8e3;background:#fff;color:var(--ink);border-radius:12px;padding:6px 14px;cursor:pointer}
  .b-line .tile{border-color:var(--accent2);background:#e8f7fd}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.review-btn{background:var(--purple);margin-top:12px}
  .feedback{min-height:30px;margin-top:16px;text-align:center;font-size:19px}
  .feedback .yes{color:var(--ok);font-weight:700;font-size:22px}
  .feedback .no{color:var(--bad);font-weight:700}
  .feedback .why{display:block;margin-top:6px;color:var(--ink)}
  .tr{display:block;margin-top:6px;color:#1e3a8a;font-weight:700;font-size:20px}
  .q-tr{text-align:center;color:#1e3a8a;font-weight:700;font-size:26px;margin:-8px 0 16px}
  .mist .tr{font-size:18px;margin-top:2px}
  @media (max-width:560px){.q-tr{font-size:22px}}
  .next-row{text-align:center;margin-top:14px}

  /* תוצאות */
  .result-big{text-align:center;font-size:30px;font-weight:700;margin:6px 0}
  .stars{text-align:center;font-size:36px}
  .mist{border-right:4px solid var(--bad);background:#fff5f7;border-radius:10px;padding:8px 12px;margin:8px 0}
  .mist .en{font-size:20px}
  .center{text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .note{text-align:center;color:var(--muted);font-size:15px;margin-top:18px}

  @media (max-width:560px){
    .q-text{font-size:26px} .opt{font-size:21px;min-width:90px;padding:8px 16px}
  }

  /* ===== פס המותג (זהה בכל העמודים) ===== */
  .bb{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 14px;background:#fff;border-bottom:3px solid #E0A562;font-family:Rubik,system-ui,sans-serif;direction:rtl}
  .bb-brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:#0F766E}
  .bb-brand svg{width:42px;height:42px;transition:transform .3s}
  .bb-brand:hover svg{transform:rotate(-6deg) scale(1.08)}
  .bb-txt{display:flex;flex-direction:column;line-height:1.15}
  .bb-txt b{font-family:Andika,sans-serif;font-size:19px;direction:ltr;text-align:right}
  .bb-txt small{font-size:15px;color:#A8692E;font-weight:600}
  .bb-tabs{display:flex;gap:6px;flex-wrap:wrap}
  .bb-tabs a{text-decoration:none;font-weight:700;font-size:18px;padding:7px 14px;border-radius:999px;color:#0F766E;border:2px solid #0F766E;background:#fff}
  .bb-tabs a.on{background:#0F766E;color:#fff}
  .bb-ver{align-self:center;font-size:12px;color:#9a9cad;direction:ltr;margin-inline-start:4px}
/*KBD-CSS-START*/
.okbd-tog{border:2px solid #0F766E;background:#fff;color:#0F766E;border-radius:12px;font:700 17px Rubik,system-ui,sans-serif;padding:8px 12px;cursor:pointer;margin:8px 4px 0;vertical-align:middle}
.okbd-tog.on{background:#0F766E;color:#fff}
.okbd{position:fixed;left:0;right:0;bottom:0;z-index:200;background:#e9edf3;border-top:3px solid #E0A562;padding:8px 4px calc(8px + env(safe-area-inset-bottom));direction:ltr;user-select:none;-webkit-user-select:none;touch-action:manipulation;box-shadow:0 -6px 20px rgba(43,45,66,.15)}
.okbd[hidden]{display:none}
.okbd-row{display:flex;justify-content:center;gap:5px;margin:5px auto;max-width:760px}
.okbd button{flex:1 1 0;max-width:68px;min-width:0;height:54px;border:none;border-radius:10px;background:#fff;color:#2b2d42;font:400 30px Andika,sans-serif;box-shadow:0 2px 0 #b9c0cc;cursor:pointer;padding:0;touch-action:manipulation}
.okbd button:active,.okbd button.down{background:#ffe066;transform:translateY(2px);box-shadow:none}
.okbd .wide{max-width:none;flex:5 1 0}
.okbd .mid{max-width:110px;flex:1.6 1 0;font:700 20px Rubik,system-ui,sans-serif}
.okbd .go{background:#2ec4b6;color:#fff}
.okbd .x{background:#eef0f6;color:#7a7d92}
body.okbd-open{padding-bottom:260px}
@media (max-width:560px){.okbd button{height:48px;font-size:24px}.okbd-row{gap:3px}}
/*KBD-CSS-END*/
/*CHEER-CSS-START*/
.ocf{position:fixed;top:-20px;width:10px;height:14px;border-radius:2px;pointer-events:none;z-index:9999;animation:ocf-fall linear forwards}
@keyframes ocf-fall{0%{transform:translate(0,0) rotate(0);opacity:1}80%{opacity:1}100%{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:0}}
@media (prefers-reduced-motion:reduce){.ocf{display:none}}
.ocheer-btn{border:2px solid #0F766E;background:#fff;border-radius:999px;width:38px;height:38px;font-size:18px;line-height:1;cursor:pointer;padding:0;flex:none}
.ocheer-btn.fixed{position:fixed;left:10px;bottom:10px;z-index:9998;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.ocheer-toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#0F766E;color:#fff;font:700 17px Rubik,system-ui,sans-serif;padding:8px 18px;border-radius:999px;z-index:10000;pointer-events:none;transition:opacity .3s;direction:rtl}
/*CHEER-CSS-END*/
</style>
</head>
<body>
<nav class="bb" aria-label="ניווט ראשי">
  <a class="bb-brand" href="index.html" aria-label="unbox your English, לדף הבית"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="14" y="4" width="20" height="20" rx="5" fill="#0F766E" transform="rotate(-10 24 14)"/><text x="24" y="20" text-anchor="middle" font-family="Andika,Rubik,sans-serif" font-weight="700" font-size="15" fill="#fff" transform="rotate(-10 24 14)">A</text><path d="M6 22 L42 22 L39 44 L9 44 Z" fill="#E0A562"/><path d="M6 22 L2 15 M42 22 L46 15" stroke="#A8692E" stroke-width="3" stroke-linecap="round"/><rect x="21" y="22" width="6" height="22" fill="#F0C48A" opacity=".8"/></svg><span class="bb-txt"><b>unbox your English</b><small>לצאת מהקופסה עם יראת זוארץ</small></span></a>
  <div class="bb-tabs"><a href="dictation.html">📝 הכתבה</a><a href="stories/index.html">📚 סיפורים</a><a href="tests.html" class="on">🎯 הכנה למבחן</a><span class="bb-ver" title="גרסה">v<!--VER-->2.4.0<!--/VER--></span></div>
</nav>
<header>
  <h1>🎯 הכנה למבחן</h1>
</header>

<main>
  <!-- ===== מסך ראשי ===== -->
  <section id="home">
    <div class="dates" id="dates"></div>
    <div class="countdown" id="countdown"></div>
    <p class="test-title" id="testTitle"></p>

    <h2>📚 הנושאים למבחן</h2>
    <div class="topics" id="topics"></div>

    <div class="mock">
      <button class="btn big" id="mockBtn">🏁 מבחן ניסיון — 20 שאלות מכל הנושאים</button>
      <div class="t-best" id="mockBest"></div>
      <div id="reviewBox">
        <button class="btn big review-btn" id="reviewBtn">📄 דף החזרה של המורה — כל המשימות לפי הסדר</button>
        <div class="t-best" id="reviewBest"></div>
      </div>
    </div>

    <div id="storiesBox">
      <h2>📚 סיפורים למבחן</h2>
      <div class="links" id="storyLinks"></div>
    </div>

    <div id="linksBox">
      <h2>🔗 תרגול נוסף מהמורה</h2>
      <div class="links" id="links"></div>
    </div>
  </section>

  <!-- ===== הסבר ===== -->
  <section id="ruleView" hidden>
    <div class="card rule">
      <div class="bar-top"><h2 id="ruleTitle" style="margin:0"></h2><button class="btn secondary" data-home>↩ חזרה לנושאים</button></div>
      <p class="tip">💡 לחצי על דוגמה כדי לשמוע אותה</p>
      <div id="ruleBody"></div>
      <div class="center"><button class="btn big" id="ruleToPractice">🎮 עכשיו לתרגל!</button></div>
    </div>
  </section>

  <!-- ===== שאלות ===== -->
  <section id="quizView" hidden>
    <div class="card">
      <div class="bar-top">
        <b id="quizLabel"></b>
        <div class="bar"><div id="quizBar"></div></div>
        <span id="quizCount"></span>
        <button class="btn secondary" data-home>↩ לנושאים</button>
      </div>
      <div class="q-prompt" id="qPrompt"></div>
      <div class="q-text" id="qText"></div>
      <div class="q-tr" id="qTr" hidden></div>
      <div id="qAnswer"></div>
      <div class="feedback" id="qFeedback"></div>
      <div class="next-row"><button class="btn big" id="qNext" hidden>הבא ◀</button></div>
    </div>
  </section>

  <!-- ===== תוצאות ===== -->
  <section id="resultView" hidden>
    <div class="card">
      <div class="stars" id="resStars"></div>
      <div class="result-big" id="resScore"></div>
      <p class="test-title" id="resText"></p>
      <div id="resMistakes"></div>
      <div class="center">
        <button class="btn big" id="resPractice">🔁 לתרגל את הטעויות</button>
        <button class="btn" id="resAgain">🔄 עוד סיבוב</button>
        <button class="btn secondary" data-home>🏠 חזרה לנושאים</button>
      </div>
    </div>
  </section>

  <p class="note" id="voiceNote"></p>
</main>

<script>
/*CHEER-START*/
const OCheer = (() => {
  const HE = {
    good: ["כל הכבוד!", "יָפֶה מְאוֹד!", "תשובה נכונה!", "מצוין!", "אַתְּ אַלּוּפָה!", "נהדר!", "יופי של תשובה!"],
    retry: ["נַסִּי שׁוּב", "כִּמְעַט! נַסִּי שׁוּב", "לא נורא, נַסִּי שׁוּב"],
    bad: ["לא נורא!", "אוּפְּס, לא נכון", "לא נורא, נִלְמַד מזה"],
    win: ["וואו! כל הכבוד!", "מושלם! אַתְּ אַלּוּפָה!"]
  };
  const EN = {
    good: ["Great job!", "Well done!", "Excellent!", "Correct!", "Awesome!"],
    retry: ["Try again!", "Almost! Try again."],
    bad: ["Oops! Not quite.", "That's OK!"],
    win: ["Wow! Perfect!", "Amazing work!"]
  };
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const MODES = { all:["🔊","קול ומנגינה פועלים"], off:["🔇","השתקה"] };
  const ORDER = ["all", "off"];
  let mode = "all";
  try { mode = localStorage.getItem("or-cheer") || "all"; } catch(e){}
  if (!MODES[mode]) mode = "all";
  let btn = null, toastT = 0;
  function paint(){ if (btn){ btn.textContent = MODES[mode][0]; btn.title = MODES[mode][1] + " (לחצי כדי לשנות)"; btn.setAttribute("aria-label", btn.title); } }
  function toast(t){
    let el = document.querySelector(".ocheer-toast");
    if (!el){ el = document.createElement("div"); el.className = "ocheer-toast"; document.body.appendChild(el); }
    el.textContent = t; el.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => el.style.opacity = 0, 1400);
  }
  function addButton(){
    if (btn) return;
    btn = document.createElement("button"); btn.type = "button"; btn.className = "ocheer-btn";
    btn.onclick = () => {
      mode = ORDER[(ORDER.indexOf(mode) + 1) % ORDER.length];
      try { localStorage.setItem("or-cheer", mode); } catch(e){}
      paint(); toast(MODES[mode][0] + " " + MODES[mode][1]);
      if (mode !== "off") happy();
    };
    const tabs = document.querySelector(".bb-tabs");
    if (tabs) tabs.insertBefore(btn, tabs.querySelector(".bb-ver"));
    else { btn.classList.add("fixed"); document.body.appendChild(btn); }
    paint();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", addButton); else addButton();
  let ctx = null, heV = null, enV = null;
  function voices(){
    if (!("speechSynthesis" in window)) return;
    const vs = speechSynthesis.getVoices();
    const he = vs.filter(v => /^(he|iw)/i.test(v.lang));
    heV = he.find(v => /hila/i.test(v.name)) || he.find(v => /natural|online/i.test(v.name)) || he[0] || null;
    const en = vs.filter(v => /^en[-_]US/i.test(v.lang));
    enV = en.find(v => /(jenny|aria|ava|emma|michelle).*natural/i.test(v.name)) || en.find(v => /natural|online/i.test(v.name)) || en[0] || null;
  }
  if ("speechSynthesis" in window){ voices(); speechSynthesis.addEventListener("voiceschanged", voices); }

  // צלילים (Web Audio, בלי קבצים)
  function tones(notes, type, vol, step, len){
    if (mode === "off") return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      notes.forEach((f, i) => {
        if (!f) return;
        const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * step;
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + len);
        o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + len + 0.05);
      });
    } catch(e){}
  }
  const happy = () => { tones([523, 659, 784, 1047], "triangle", 0.2, 0.09, 0.35); tones([0, 0, 0, 1319], "sine", 0.08, 0.09, 0.5); };
  const oops  = () => tones([392, 330], "sine", 0.12, 0.16, 0.3);
  const fanfare = () => { tones([523, 659, 784, 1047, 0, 784, 1047], "triangle", 0.2, 0.12, 0.4); tones([262, 330, 392, 523, 0, 392, 523], "sine", 0.08, 0.12, 0.5); };

  // קונפטי שיורד מלמעלה ונעלם
  const COLORS = ["#0F766E", "#E0A562", "#ff5d8f", "#ffd23f", "#4cc9f0", "#8b5cf6", "#34d399"];
  function confetti(n){
    for (let i = 0; i < n; i++){
      const s = document.createElement("i"); s.className = "ocf";
      s.style.left = Math.random() * 100 + "vw";
      s.style.background = pick(COLORS);
      if (Math.random() < 0.3) s.style.borderRadius = "50%";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");

const OKbd = (() => {
  const KEY = "or-kbd";
  let on = false, target = null, panel = null;
  try { on = localStorage.getItem(KEY) === "1"; } catch(e){}
  const rows = ["qwertyuiop", "asdfghjkl", "zxcvbnm"];
  function build(){
    panel = document.createElement("div"); panel.className = "okbd"; panel.hidden = true;
    const row = keys => { const r = document.createElement("div"); r.className = "okbd-row"; keys.forEach(k => r.appendChild(k)); panel.appendChild(r); };
    const key = (label, act, cls) => { const b = document.createElement("button"); b.type = "button"; b.textContent = label; if (cls) b.className = cls;
      b.addEventListener("pointerdown", e => { e.preventDefault(); b.classList.add("down"); act(); });
      ["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, () => b.classList.remove("down")));
      return b; };
    rows.forEach((s, i) => row([...s].map(c => key(c, () => type(c))).concat(i === 2 ? [key("⌫", back, "mid")] : [])));
    row([key("✖", () => set(false), "mid x"), key("'", () => type("'")), key("space", () => type(" "), "wide"), key(".", () => type(".")), key("✔", enter, "mid go")]);
    document.body.appendChild(panel);
  }
  function vis(){ return !!(target && target.isConnected && target.offsetParent !== null); }   // לא נעלמת בין מילה למילה
  function live(){ return vis() && !target.disabled && !target.readOnly; }
  function type(s){
    if (!live()) return;
    const el = target, a = el.selectionStart ?? el.value.length, b = el.selectionEnd ?? a;
    el.value = el.value.slice(0, a) + s + el.value.slice(b);
    try { el.setSelectionRange(a + s.length, a + s.length); } catch(e){}
    el.dispatchEvent(new Event("input", {bubbles:true}));
  }
  function back(){
    if (!live()) return;
    const el = target, a = el.selectionStart ?? el.value.length, b = el.selectionEnd ?? a;
    const from = a === b ? Math.max(0, a - 1) : a;
    el.value = el.value.slice(0, from) + el.value.slice(b);
    try { el.setSelectionRange(from, from); } catch(e){}
    el.dispatchEvent(new Event("input", {bubbles:true}));
  }
  function enter(){ if (live()) target.dispatchEvent(new KeyboardEvent("keydown", {key:"Enter", bubbles:true, cancelable:true})); }
  function sync(){
    const show = on && vis();
    if (panel) panel.hidden = !show;
    document.body.classList.toggle("okbd-open", !!show);
    document.querySelectorAll(".okbd-tog").forEach(t => { t.classList.toggle("on", on); t.textContent = on ? "⌨️ סגירת המקלדת" : "⌨️ מקלדת"; });
    if (target) target.inputMode = on ? "none" : "text";      // במקלדת שלנו: בלי מקלדת המערכת בטאבלט
  }
  function set(v){ on = v; try { localStorage.setItem(KEY, v ? "1" : "0"); } catch(e){} sync(); if (live()) target.focus(); }
  function attach(input){
    if (!panel) build();
    target = input;
    if (!input.nextElementSibling || !input.nextElementSibling.classList.contains("okbd-tog")){
      const t = document.createElement("button"); t.type = "button"; t.className = "okbd-tog";
      t.addEventListener("pointerdown", e => e.preventDefault());
      t.onclick = () => set(!on);
      input.after(t);
    }
    input.addEventListener("focus", () => { target = input; sync(); });
    sync();
  }
  setInterval(() => { if (panel) { const s = on && vis(); if (panel.hidden === s) sync(); } }, 300);
  return { attach, sync };
})();

  enVoice = en.find(v => /natural|online/i.test(v.name) && /en[-_]US/i.test(v.lang))
         || en.find(v => /en[-_]US/i.test(v.lang)) || en[0] || null;
  $("voiceNote").textContent = enVoice ? "" : "💡 לא נמצא קול באנגלית — ההקראה לא תעבוד בדפדפן הזה.";
}
if ("speechSynthesis" in window){ pickVoices(); speechSynthesis.onvoiceschanged = pickVoices; }
function say(text, rate = 0.8, queue = false){   // queue = להוסיף לתור, אחרי משפט העידוד
  if (!("speechSynthesis" in window)) return;
  if (!queue) speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/→/g, ", "));
  if (enVoice) u.voice = enVoice; u.lang = enVoice ? enVoice.lang : "en-US"; u.rate = rate;
  speechSynthesis.speak(u);
}
document.addEventListener("click", e => { const s = e.target.closest(".say"); if (s) say(s.textContent); });

/* ===== מחוללי שאלות לפי סוג נושא =====
   שאלה: {kind:"choice"|"write", prompt, q, o, a, why, sayText, he:true אם q בעברית} */
const VOWELS = "aeiou";
const GEN = {
  aan(t){
    const frames = ["It is ___ X.", "This is ___ X.", "There is ___ X."];
    const why = (w, ans) => ans === "an" ? `המילה ${w} מתחילה בצליל של תנועה (${w[0]}), ולכן an.` : `המילה ${w} מתחילה בצליל של עיצור (${w[0]}), ולכן a.`;
    // תרגום: "זה/זאת" לפי המין במילון he (כוכבית = נקבה), ו"יש" ל-There is
    const heOf = (w, f) => { const x = (t.heW || {})[w]; if (!x) return undefined; const fem = x.endsWith("*"), n = x.replace("*", "");
      return f.startsWith("There") ? `יש ${n}.` : `${fem ? "זאת" : "זה"} ${n}.`; };
    const out = [...t.a.map(w => [w, "a"]), ...t.an.map(w => [w, "an"])].map(([w, ans]) => { const f = pick(frames); return {
      kind:"choice", prompt:"השלימי a או an", q: f.replace("X", w), o:["a", "an"], a: ans, why: why(w, ans), tr: heOf(w, f) }; });
    for (const [q, ans] of t.sentences || []){
      const w = q.split("___ ")[1].split(/[ .]/)[0];
      out.push({ kind:"choice", prompt:"השלימי a או an (שימי לב למילה שמיד אחרי)", q, o:["a", "an"], a: ans, why: why(w, ans) });
    }
    return out;
  },
  thereis(t){
    const H = t.heW || {}, tr = (x, p) => H[x] && H[p] ? `יש ${H[x]} ${H[p]}.` : undefined;   // There is/are = יש
    const mk = (x, ans) => {
      const last = x.split(" ").pop().replace(/s$/, "");
      const place = pick(t.places.filter(p => !p.includes(last))) || t.places[0];
      const place2 = pick(t.places.filter(p => !p.includes(last))) || place;
      const why = ans === "is" ? `הביטוי ${x} הוא יחיד (אחד), ולכן There is.` : `הביטוי ${x} הוא ברבים, ולכן There are.`;
      return [{ kind:"choice", prompt:"השלימי is או are", q:`There ___ ${x} ${place}.`, o:["is", "are"], a: ans, why, tr: tr(x, place) },
              // כמו בדף החזרה: כותבים את שתי המילים בעצמן
              { kind:"write", prompt:"כתבי There is או There are", q:`___ ${x} ${place2}.`, a:`There ${ans}`, alt:[ans === "is" ? "there's" : "there're"], why, tr: tr(x, place2) }];
    };
    return [...t.one.flatMap(x => mk(x, "is")), ...t.many.flatMap(x => mk(x, "are"))];
  },
  plural(t){
    const g = t.groups, irr = t.irregular || {}, info = {};
    const PLURAL = { s: w => w + "s", es: w => w + "es", ies: w => w.slice(0, -1) + "ies", ys: w => w + "s", same: w => w, irr: w => irr[w] };
    const plural = w => info[w] ? PLURAL[info[w]](w) : w + "s";
    const art = w => /^[aeiou]/.test(w) ? "an" : "a";
    const why = (k, w) => {
      if (k === "s") return `רוב המילים: מוסיפים s.`;
      if (k === "es") return `המילה ${w} מסתיימת ב-${(w.match(/(sh|ch|ss|s|x|z)$/) || [""])[0]}, ולכן מוסיפים es.`;
      if (k === "ies") return `לפני ה-y יש עיצור (${w.slice(-2, -1)}), ולכן y הופכת ל-ies.`;
      if (k === "same") return `המילה ${w} לא משתנה ברבים: one ${w}, two ${w}.`;
      if (k === "irr") return `המילה ${w} יוצאת דופן: ברבים ${irr[w]}. את זה זוכרים בעל פה.`;
      return `לפני ה-y יש תנועה (${w.slice(-2, -1)}), ולכן מוסיפים רק s.`;
    };
    for (const k in g) for (const w of g[k]) info[w] = k;
    for (const w in irr) info[w] = "irr";
    const out = [];
    for (const w in info){
      const k = info[w], ans = PLURAL[k](w);
      out.push({ kind:"write", prompt:"כתבי ברבים", q:`one ${w} → two ___`, a: ans, why: why(k, w), sayText:`one ${w}, two ${ans}` });
      const wrong = w.endsWith("y") ? [w + "s", w.slice(0, -1) + "ies", w + "es"] : [w + "s", w + "es", w + "ies"];
      out.push({ kind:"choice", prompt:"בחרי את צורת הרבים הנכונה", q:`${art(w)} ${w} → ___`, o:[...new Set([ans, ...wrong])].slice(0, 3), a: ans, why: why(k, w) });
      // מרבים ליחיד, עם a/an (משימה 5 בדף החזרה)
      out.push({ kind:"write", prompt:"כתבי ביחיד, עם a או an", q:`${ans} → ___`, a:`${art(w)} ${w}`,
        why:`ביחיד: ${art(w)} ${w}. לא לשכוח ${art(w)}${art(w) === "an" ? ", כי המילה מתחילה בתנועה" : ""}.`, sayText:`${ans}, ${art(w)} ${w}` });
    }
    for (const [s, w] of t.sentences){
      const ans = plural(w);
      out.push({ kind:"choice", prompt:"יחיד או רבים?", q: s, o: ans === w ? [w, w + "s"] : [w, ans], a: ans, why:`אחרי מספר או a lot of / many צריך רבים: ${ans}. ${why(info[w] || "s", w)}` });
    }
    return out;
  },
  can(t){
    const out = t.facts.flatMap(([q, a, why]) => [{ kind:"choice", prompt:"השלימי can או can't", q, o:["can", "can't"], a, why },
                                                  { kind:"write", prompt:"כתבי can או can't", q, a, alt: a === "can't" ? ["cannot"] : [], why }]);
    for (const [q, good, bad] of t.base){
      out.push({ kind:"choice", prompt:"בחרי את הפועל הנכון", q, o:[good, bad], a: good, why:`אחרי can / can't לא מוסיפים s: ${q.replace("___", good)}` });
    }
    out.push(...t.base.slice(0, 5).map(([q, good, bad]) => ({ kind:"choice", prompt:"איזה משפט נכון?", q:"", o:[q.replace("___", good), q.replace("___", bad)], a: q.replace("___", good), why:"אחרי can / can't הפועל בלי s." })));
    return out;
  },
  vocab(t){
    const out = [];
    for (const [en, he] of t.words){
      const others = shuffle(t.words.filter(w => w[0] !== en)).slice(0, 3);
      out.push({ kind:"choice", prompt:"מה התרגום?", q: en, o:[he, ...others.map(w => w[1])], a: he, optHe:true, why:`${en} = ${he}`, sayFirst:true });
      out.push({ kind:"choice", prompt:"איך אומרים באנגלית?", q: he, he:true, o:[en, ...others.map(w => w[0])], a: en, why:`${he} = ${en}` });
    }
    return out;
  },
  bank(t){
    return t.sentences.flatMap(([q, a]) => {
      const others = shuffle(t.bank.filter(w => w !== a)).slice(0, 3);
      const why = `המשפט המלא: ${q.replace("___", a)}`;
      return [{ kind:"choice", prompt:"בחרי מילה ממחסן המילים", q, o:[a, ...others], a, why },
              { kind:"write", prompt:"השלימי ממחסן המילים (יש מילים מיותרות)", q, a, bank: t.bank, why }];
    });
  },
  room(t){
    const out = [];
    for (const [en, he, prep] of t.lines){
      out.push(buildQ(he, en));
      const others = shuffle(t.preps.map(p => p[0]).filter(p => p !== prep)).slice(0, 3);
      out.push({ kind:"choice", prompt:`השלימי את מילת היחס: ${he}`, q: en.replace(new RegExp(`\\b${prep}\\b`), "___"), o:[prep, ...others], a: prep,
        why:`המילה ${prep} = ${t.preps.find(p => p[0] === prep)[1]}` });
      const wrongHe = shuffle(t.lines.filter(l => l[0] !== en)).slice(0, 2).map(l => l[1]);
      out.push({ kind:"choice", prompt:"מה פירוש המשפט?", q: en, o:[he, ...wrongHe], a: he, optHe:true, sayFirst:true, why:`${en} = ${he}` });
    }
    for (const [en, he] of t.preps){
      const others = shuffle(t.preps.filter(p => p[0] !== en)).slice(0, 3);
      out.push({ kind:"choice", prompt:"מה פירוש מילת היחס?", q: en, o:[he, ...others.map(p => p[1])], a: he, optHe:true, sayFirst:true, why:`${en} = ${he}` });
    }
    out.push(...shuffle(GEN.vocab(t)).slice(0, 16));
    return out;
  },
  items(t){ return t.items.map(x => ({...x})); }
};
// שאלת "סדרי את המילים": he = המשפט בעברית, en = המשפט הנכון. האריחים הם המילים (הנקודה צמודה למילה האחרונה)
function buildQ(he, en, prompt){
  return { kind:"build", prompt: prompt || "סדרי את המילים למשפט באנגלית", q: he, he:true, a: en, tiles: en.split(" "), sayText: en,
           why:`המשפט: ${en} (אות גדולה בהתחלה ונקודה בסוף)` };
}
// דף החזרה של המורה → רשימת שאלות לפי הסדר
function reviewQs(t){
  const out = [];
  for (const s of t.review){
    for (const [q, a, why, o] of s.list){
      if (s.kind === "build") out.push(buildQ(q, a, s.prompt));
      else if (s.kind === "translate"){
        const wrongHe = shuffle(s.list.filter(x => x[0] !== q)).slice(0, 2).map(x => x[1]);
        out.push({ kind:"choice", prompt: s.prompt, q, o:[a, ...wrongHe], a, optHe:true, sayFirst:true, why:`${q} = ${a}` });
      }
      else out.push({ kind: s.kind, prompt: s.prompt, q, a, o: o || s.o, bank: s.bank, why: why || "" });
    }
  }
  return out.map(x => withTr({...x, topicId:"review"}));
}
function pool(topic){
  const seen = new Set();
  return GEN[topic.kind](topic).filter(x => { const k = x.prompt + x.q + x.o; if (seen.has(k)) return false; seen.add(k); return true; })
    .map(x => withTr({...x, topicId: topic.id}));
}
// תרגום לעברית של המשפט המלא, מוצג אחרי התשובה. מהמילון tr של המבחן, אם השאלה לא בנתה אותו בעצמה
function withTr(x){
  if (x.tr || x.he || x.optHe || x.kind === "build") return x;
  const s = fullSentence(x, x.a), T = (test && test.tr) || {};
  return T[s] ? {...x, tr: T[s]} : x;
}

    dates.appendChild(b);

  const d = daysLeft(test.date);

    const c = document.createElement("div"); c.className = "topic";
    c.innerHTML = `<div class="t-emoji"></div><div class="t-en"></div><div class="t-he"></div><div class="t-best"></div><div class="t-btns"></div>`;
    c.querySelector(".t-emoji").textContent = t.emoji;
    c.querySelector(".t-en").textContent = t.en;
    c.querySelector(".t-he").textContent = t.he;
    c.querySelector(".t-best").textContent = B[t.id] != null ? `⭐ התוצאה הכי טובה: ${B[t.id]}%` : "";
    const btns = c.querySelector(".t-btns");
    if (t.rule){
      const r = document.createElement("button"); r.className = "btn secondary"; r.textContent = "📖 הסבר";
      r.onclick = () => showRule(t); btns.appendChild(r);
    }
    const p = document.createElement("button"); p.className = "btn"; p.textContent = "🎮 תרגול";
    p.onclick = () => startPractice(t); btns.appendChild(p);
    box.appendChild(c);
  }
  $("mockBest").textContent = B.mock != null ? `⭐ התוצאה הכי טובה במבחן הניסיון: ${B.mock}` : "";
  $("reviewBox").hidden = !(test.review && test.review.length);
  $("reviewBest").textContent = B.review != null ? `⭐ התוצאה הכי טובה בדף החזרה: ${B.review}%` : "";
  const sl = $("storyLinks"); sl.innerHTML = "";

    sl.appendChild(a);
  }

  $("linksBox").hidden = !(test.links && test.links.length);
  for (const l of test.links || []){
    const a = document.createElement("a"); a.href = l.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = l.title;
    links.appendChild(a);
  }
}

/* ===== תרגול ומבחן ניסיון =====
   run = {mode:"practice"|"mock", label, queue, i, total, firstWrong:Set, answers:[], topic} */
let run = null;
function startPractice(topic, list){
  const qs = list || (topic.kind === "review" ? reviewQs(test) : shuffle(pool(topic)).slice(0, 10));
  run = { mode:"practice", topic, label: topic ? `${topic.emoji} ${topic.kind === "review" ? "דף החזרה" : topic.en}` : "🔁 הטעויות שלי",
          queue: qs.map(q => ({...q})), total: qs.length, done: 0, wrong: [], retried: new Set() };
  enterScreen(); show("quizView"); showQ();
}
function startMock(){
  const pools = test.topics.map(t => shuffle(pool(t)));
  const qs = [];
  for (let i = 0; qs.length < 20 && i < 50; i++){ const p = pools[i % pools.length]; if (p.length) qs.push(p.pop()); }
  run = { mode:"mock", topic:null, label:"🏁 מבחן ניסיון", queue: shuffle(qs), total: qs.length, done: 0, wrong: [], answers: [] };
  enterScreen(); show("quizView"); showQ();
}

let cur = null, locked = false;
function showQ(){
  cur = run.queue[0]; locked = false;
  $("quizLabel").textContent = run.label;
  $("quizCount").textContent = `${Math.min(run.done + 1, run.total)} / ${run.total}`;
  $("quizBar").style.width = (run.done / run.total * 100) + "%";
  $("qPrompt").textContent = (cur.retry ? "🔁 עוד ניסיון — " : "") + cur.prompt;
  $("qFeedback").innerHTML = ""; $("qNext").hidden = true; $("qTr").hidden = true;
  const qt = $("qText"); qt.className = "q-text" + (cur.he ? " he" : ""); qt.innerHTML = "";
  if (cur.q){
    const parts = cur.q.split("___");
    qt.append(parts[0]);
    if (parts.length > 1){ const b = document.createElement("span"); b.className = "blank"; b.id = "blank"; b.innerHTML = "&nbsp;"; qt.append(b, parts[1]); }
  }
  qt.hidden = !cur.q;
  const ans = $("qAnswer"); ans.innerHTML = "";
  if (cur.bank){
    const b = document.createElement("div"); b.className = "wbank";
    b.innerHTML = `<div class="wb-title">🧺 מחסן מילים · Word Bank</div><div class="wb-words en"></div>`;
    b.querySelector(".wb-words").textContent = cur.bank.join(" · ");
    ans.appendChild(b);
  }
  if (cur.kind === "write"){
    const w = document.createElement("div"); w.className = "write";
    w.innerHTML = `<input id="qInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn" id="qCheck">✔ בדיקה</button>`;
    ans.appendChild(w);
    const inp = $("qInput"); OKbd.attach(inp); setTimeout(() => inp.focus(), 50);
    inp.onkeydown = e => { if (e.key === "Enter") checkWrite(); };
    $("qCheck").onclick = checkWrite;
  } else if (cur.kind === "build"){
    // האריחים: לחיצה מעבירה מילה לשורת המשפט, ולחיצה על מילה במשפט מחזירה אותה
    const line = document.createElement("div"); line.className = "b-line"; line.id = "bLine";
    const pool = document.createElement("div"); pool.className = "b-pool";
    const chk = document.createElement("button"); chk.className = "btn"; chk.id = "qCheck"; chk.textContent = "✔ בדיקה"; chk.disabled = true;
    const move = t => { if (locked) return; (t.parentNode === pool ? line : pool).appendChild(t); chk.disabled = pool.children.length > 0; };
    shuffle(cur.tiles.map((w, i) => [w, i])).forEach(([w, i]) => {
      const t = document.createElement("button"); t.className = "tile"; t.textContent = w; t.dataset.i = i;
      t.onclick = () => move(t); pool.appendChild(t);
    });
    const row = document.createElement("div"); row.className = "center"; row.appendChild(chk);
    ans.append(line, pool, row);
    chk.onclick = () => { if (!pool.children.length) answer([...line.children].map(t => t.textContent).join(" "), chk); };
  } else {
    const o = document.createElement("div"); o.className = "opts";
    for (const opt of shuffle([...cur.o])){
      const b = document.createElement("button"); b.className = "opt" + (cur.optHe ? " he" : ""); b.textContent = opt;
      b.onclick = () => answer(opt, b); o.appendChild(b);
    }
    ans.appendChild(o);
  }
  if (cur.sayFirst) say(cur.q);
}
const norm = s => s.trim().toLowerCase().replace(/[’`]/g, "'").replace(/\s+/g, " ");
function checkWrite(){
  const inp = $("qInput"); if (!inp.value.trim() || locked) return;
  answer(inp.value.trim(), inp);
}
// התרגום מופיע מתחת למשפט באנגלית, רק אחרי התשובה
function showTr(){ const t = $("qTr"); t.textContent = cur.tr ? cur.tr : ""; t.hidden = !cur.tr; }
function addTr(box, q){
  if (!q.tr) return;
  const s = document.createElement("span"); s.className = "tr"; s.textContent = q.tr; box.appendChild(s);
}
function fullSentence(q, a){ return q.sayText || (q.q.includes("___") ? q.q.replace("___", a) : (q.he ? a : q.q || a)); }

function answer(given, el){
  if (locked) return; locked = true;
  const ok = cur.kind === "build" ? given === cur.a : [cur.a, ...(cur.alt || [])].some(x => norm(given) === norm(x));
  const blank = $("blank");
  if ($("bLine")) $("bLine").classList.add(ok ? "ok" : "bad");
  document.querySelectorAll(".opt").forEach(b => b.disabled = true);
  if (run.mode === "mock"){
    el.classList.add("picked");
    if (blank) blank.textContent = given;
    if (!ok) run.wrong.push({...cur, given});
    run.done++; run.queue.shift();
    setTimeout(next, 450);
    return;
  }
  if (ok){
    el.classList.add("ok");
    if (blank){ blank.textContent = cur.a; blank.classList.add("ok"); }
    $("qFeedback").innerHTML = `<span class="yes">${pick(["✓ נכון!", "✓ כל הכבוד!", "✓ מצוין!", "✓ יופי!"])}</span>`;
    showTr();
    const sent = fullSentence(cur, cur.a);
    OCheer.good(() => say(sent, 0.8, true));
    run.queue.shift(); run.done++;
    $("qNext").hidden = false; $("qNext").focus();   // לא עוברים לבד: יש זמן לקרוא את התרגום
  } else {
    el.classList.add("bad");
    document.querySelectorAll(".opt").forEach(b => { if (norm(b.textContent) === norm(cur.a)) b.classList.add("ok"); });
    if (blank){ blank.textContent = cur.a; blank.classList.add("bad"); }
    const fb = $("qFeedback"); fb.innerHTML = "";
    const no = document.createElement("span"); no.className = "no";
    no.textContent = cur.kind === "write" ? "✗ כמעט! התשובה הנכונה: " : "✗ לא נכון. התשובה הנכונה: ";
    const right = document.createElement("b"); right.className = "en"; right.textContent = cur.a;
    const why = document.createElement("span"); why.className = "why"; why.textContent = "💡 " + cur.why;
    fb.append(no, right, why); showTr();
    const sent = fullSentence(cur, cur.a);
    OCheer.bad(false, () => say(sent, 0.8, true));
    if (!cur.retry) run.wrong.push({...cur, given});
    run.queue.shift();
    if (!cur.retry){ run.queue.push({...cur, retry:true}); run.total++; }   // חוזרים על השאלה בסוף הסיבוב
    run.done++;
    $("qNext").hidden = false; $("qNext").focus();
  }
}
$("qNext").onclick = () => next();
function next(){ if (run.queue.length) showQ(); else finish(); }

/* ===== תוצאות ===== */
function finish(){
  show("resultView");
  const firstTotal = run.mode === "mock" ? run.total : run.total - run.wrong.length;
  const right = firstTotal - run.wrong.length;
  const pct = Math.round(right / firstTotal * 100);
  if (pct === 100) OCheer.win(); else if (pct >= 70) OCheer.confetti(60);
  $("resStars").textContent = pct >= 90 ? "🏆⭐⭐⭐" : pct >= 70 ? "⭐⭐" : pct >= 50 ? "⭐" : "💪";
  if (run.mode === "mock"){
    $("resScore").textContent = `ציון: ${pct}`;
    $("resText").textContent = pct >= 90 ? "וואו! את מוכנה למבחן!" : pct >= 70 ? "יפה מאוד! עוד קצת תרגול על הטעויות" : "בואי נתרגל את הטעויות ונחזור על ההסברים";
  } else {
    $("resScore").textContent = `${right} מתוך ${firstTotal} נכון בניסיון הראשון`;
    $("resText").textContent = pct === 100 ? "מושלם! כל הכבוד אור!" : pct >= 70 ? "כל הכבוד! תיקנת את כל הטעויות" : "תרגול עושה מושלם — עוד סיבוב?";
  }
  // שמירת התוצאה הכי טובה
  const B = best[test.date] = best[test.date] || {};
  const key = run.mode === "mock" ? "mock" : run.topic && run.topic.id;
  if (key) { B[key] = Math.max(B[key] || 0, pct); store.set("tests-best", best); }

  const box = $("resMistakes"); box.innerHTML = "";
  if (run.wrong.length){
    const h = document.createElement("h2"); h.textContent = "📝 מה כדאי לזכור"; box.appendChild(h);
    for (const w of run.wrong){
      const d = document.createElement("div"); d.className = "mist";
      const s = document.createElement("div"); s.className = "en say"; s.textContent = fullSentence(w, w.a);
      const g = document.createElement("div"); g.textContent = `התשובה שלך: ${w.given} · התשובה הנכונה: ${w.a}`;
      const y = document.createElement("div"); y.textContent = "💡 " + w.why;
      d.append(s, g, y); addTr(d, w); box.appendChild(d);
    }
  }
  $("resPractice").hidden = !run.wrong.length;
  const wrongList = run.wrong.map(({given, retry, ...q}) => q);
  const last = run;
  $("resPractice").onclick = () => startPractice(null, shuffle(wrongList));
  $("resAgain").onclick = () => last.mode === "mock" ? startMock() : last.topic ? startPractice(last.topic) : startPractice(null, shuffle(wrongList));
}

/* ===== התחלה ===== */
test = chooseTest();
if (history.state && history.state.v === "sub") history.replaceState(null, "");
renderHome();
</script>
